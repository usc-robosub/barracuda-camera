services:
  barracuda-camera:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: barracuda-camera
    container_name: barracuda-camera
    runtime: nvidia
    user: root
    privileged: true
    tty: true
    network_mode: host
    ipc: host
    volumes:
      - ${HOME}/.ssh:/root/.ssh
      - /tmp:/tmp
      - /var/run/nvargus-daemon/socket:/var/run/nvargus-daemon/socket
      - /dev/nvhost-ctrl:/dev/nvhost-ctrl
      - /dev/nvhost-ctrl-gpu:/dev/nvhost-ctrl-gpu
      - /dev/nvhost-gpu:/dev/nvhost-gpu
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu, compute, video, utility]
  barracuda-camera-dev:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    user: root
    runtime: nvidia
    privileged: true
    image: barracuda-camera-dev
    container_name: barracuda-camera-dev
    tty: true
    network_mode: host
    ipc: host
    volumes:
      - ${HOME}/.ssh:/root/.ssh
      - ${HOME}/.gitconfig:/root/.gitconfig
      - ${HOME}/.vimrc:/root/.vimrc
      - ../barracuda_camera:/ros2_ws/src/barracuda_camera
      - /tmp:/tmp
      - /var/run/nvargus-daemon/socket:/var/run/nvargus-daemon/socket
      - /dev/nvhost-ctrl:/dev/nvhost-ctrl
      - /dev/nvhost-ctrl-gpu:/dev/nvhost-ctrl-gpu
      - /dev/nvhost-gpu:/dev/nvhost-gpu
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu, compute, video, utility]
    profiles: ["dev"]
